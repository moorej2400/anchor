<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anchor — implementation mock</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas:#101111;
      --chrome:#161817;
      --panel:#191b1a;
      --panel-2:#1e201f;
      --terminal:#0c0e0d;
      --terminal-text:#cbd0ce;
      --line:#2b2e2c;
      --line-strong:#3a3e3b;
      --text:#d5d9d8;
      --text-soft:#afb5b2;
      --muted:#7f8783;
      --faint:#59605c;
      --selected:#292c29;
      --hover:#222522;
      --control:#202321;
      --accent:#88a99d;
      --accent-text:#0e1714;
      --notice:#62aef5;
      --danger:#cf7373;
      --green:#92bd94;
      --cyan:#77b2ba;
      --purple:#aea1c5;
      --yellow:#d0b57a;
      --radius:5px;
      --terminal-font-size:13px;
      --sidebar-width:244px;
      --workspace-width:188px;
      --settings-nav-width:220px;
    }
    .app[data-theme="obsidian"] {--canvas:#0d0e10;--chrome:#141518;--panel:#17181b;--panel-2:#1d1e22;--terminal:#090a0c;--line:#292b31;--selected:#27292f;--hover:#202227}
    .app[data-theme="nebula"] {--canvas:#101013;--chrome:#17171b;--panel:#1a1a1e;--panel-2:#202025;--terminal:#0b0b0e;--line:#2f2d35;--selected:#2c2a31;--hover:#242228}
    .app[data-density="comfortable"] {--sidebar-width:254px}
    .app[data-density="comfortable"] .session-row,.app[data-density="comfortable"] .session-select {min-height:33px;height:33px}
    .app[data-density="comfortable"] .project-head,.app[data-density="comfortable"] .project-toggle {min-height:34px;height:34px}
    * {box-sizing:border-box}
    html,body {height:100%;margin:0;overflow:hidden;background:#0b0c0c;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
    button,input,select,textarea {font:inherit}
    button {color:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {outline:2px solid var(--accent);outline-offset:1px}
    svg {display:block;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .app {display:grid;grid-template-rows:45px minmax(0,1fr);height:100%;min-width:800px;background:var(--canvas)}
    .topbar {display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--chrome);user-select:none}
    .brand {display:flex;align-items:center;gap:9px;width:var(--sidebar-width);padding:0 14px;color:#e3e6e5;font-weight:650;letter-spacing:-.1px}
    .rail-visible:not(.settings-open) .brand {width:calc(var(--workspace-width) + var(--sidebar-width))}
    .settings-open .brand {width:var(--settings-nav-width)}
    .brand svg {color:#9ba39f}
    .crumb {display:flex;align-items:center;gap:8px;min-width:0;padding-left:12px;color:var(--muted);font-size:12px}
    .crumb strong {overflow:hidden;color:#cbd0ce;font-weight:540;text-overflow:ellipsis;white-space:nowrap}
    .top-actions {display:flex;align-items:center;gap:7px;margin-left:auto;padding-right:12px}
    .button,.icon-button {display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--control);color:#b9bfbc;cursor:pointer}
    .button {height:30px;gap:7px;padding:0 11px;font-size:11px}
    .button:hover,.icon-button:hover {border-color:var(--line-strong);background:#292c2a;color:#e0e3e2}
    .button.primary {border-color:color-mix(in srgb,var(--accent),#111311 25%);background:color-mix(in srgb,var(--accent),#111311 35%);color:#f2f5f3;font-weight:630}
    .button.primary:hover {border-color:color-mix(in srgb,var(--accent),#e9eeeb 24%);background:color-mix(in srgb,var(--accent),#111311 23%);color:#fff}
    .button.danger {border-color:#704646;background:#2a1c1c;color:#e6a2a2}
    .button.ghost {background:transparent}
    .icon-button {width:28px;height:28px;padding:0}
    .shortcut {padding:2px 5px;border:1px solid #343735;border-radius:3px;background:#121413;color:#777e7a;font:9px ui-monospace,SFMono-Regular,Consolas,monospace}
    .shell {display:flex;min-height:0}

    .workspace-rail {display:flex;flex:0 0 var(--workspace-width);flex-direction:column;min-width:0;border-right:1px solid var(--line);background:#141615}
    .workspace-rail[hidden] {display:none}
    .rail-head {display:flex;align-items:center;justify-content:space-between;padding:12px 10px 9px 13px;color:#c6cbc8;font-size:12px;font-weight:590}
    .rail-search,.sidebar-search {display:flex;align-items:center;gap:7px;height:31px;margin:0 8px 6px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius);background:#0f1110;color:#69716d}
    .rail-search:focus-within,.sidebar-search:focus-within {border-color:#515854}
    .rail-search input,.sidebar-search input {min-width:0;flex:1;border:0;outline:0;background:transparent;color:#c9cecb;font-size:11px}
    .rail-search input::placeholder,.sidebar-search input::placeholder {color:#626965}
    .rail-list {min-height:0;flex:1;overflow:auto;padding:2px 7px}
    .rail-label,.section-label {display:flex;align-items:center;gap:8px;color:#747c78;font-size:9px;font-weight:630;letter-spacing:1px;text-transform:uppercase}
    .rail-label {padding:10px 7px 5px}
    .section-label {margin:13px 6px 6px}
    .section-label::after {height:1px;flex:1;background:var(--line);content:""}
    .workspace-item {display:flex;align-items:center;gap:8px;width:100%;min-height:31px;padding:0 7px;border:0;border-radius:4px;background:transparent;color:#929a96;cursor:pointer;text-align:left;font-size:11px}
    .workspace-item:hover {background:var(--hover);color:#c4cac6}
    .workspace-item.active {background:var(--selected);color:#d8dcda}
    .workspace-item span {min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .workspace-item small {color:#68706c;font:9px ui-monospace,SFMono-Regular,Consolas,monospace}
    .rail-actions {padding:7px;border-top:1px solid var(--line)}
    .rail-action {display:flex;align-items:center;gap:8px;width:100%;height:31px;padding:0 7px;border:0;border-radius:4px;background:transparent;color:#87908b;cursor:pointer;text-align:left;font-size:10.5px}
    .rail-action:hover {background:var(--hover);color:#cbd0cd}

    .sidebar {display:flex;flex:0 0 var(--sidebar-width);flex-direction:column;min-width:0;border-right:1px solid var(--line);background:var(--panel)}
    .current-workspace {display:flex;align-items:center;gap:8px;width:calc(100% - 16px);min-height:44px;margin:8px 8px 3px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius);background:#202220;color:#cdd2cf;cursor:pointer;text-align:left}
    .current-workspace:hover {border-color:var(--line-strong);background:#252825}
    .current-workspace .workspace-copy {min-width:0;flex:1}
    .current-workspace small {display:block;margin-bottom:2px;color:#818985;font-size:8px;font-weight:650;letter-spacing:1.05px}
    .current-workspace strong {display:block;overflow:hidden;font-size:12px;font-weight:540;text-overflow:ellipsis;white-space:nowrap}
    .current-workspace .chevron {color:#7d8581;transition:transform 150ms ease}
    .rail-visible .current-workspace .chevron {transform:rotate(180deg)}
    .session-lists {min-height:0;flex:1;overflow:auto;padding:0 7px 9px}
    .empty-copy {padding:10px;color:#777f7b;font-size:11px;line-height:1.45}
    .project {margin-bottom:4px}
    .project.dragging {opacity:.45}
    .project.drop-before {box-shadow:inset 0 2px var(--accent)}
    .project-head {display:flex;align-items:center;min-height:30px;border-radius:3px}
    .project-head:hover,.project-head:focus-within {background:var(--hover)}
    .project-toggle {display:flex;align-items:center;gap:6px;min-width:0;flex:1;height:30px;padding:0;border:0;background:transparent;color:#bec4c0;cursor:pointer;text-align:left}
    .disclosure {display:grid;place-items:center;width:22px;height:22px;flex:none;border:1px solid #343835;border-radius:var(--radius);background:#171918;color:#858d89}
    .project-head:hover .disclosure {border-color:#454a46;background:#232623;color:#bdc3bf}
    .project-name {min-width:0;overflow:hidden;font-size:12px;font-weight:430;text-overflow:ellipsis;white-space:nowrap}
    .project.hidden-project .project-name {color:#686f6b}
    .project-actions {display:flex;align-items:center;flex:none;padding-right:2px;opacity:.48}
    .project-head:hover .project-actions,.project-head:focus-within .project-actions {opacity:1}
    .project-actions .icon-button {width:23px;height:23px;border:0;background:transparent;color:#7f8783}
    .project-actions .icon-button:hover {background:#303431;color:#d5dad6}
    .session-row {position:relative;display:flex;align-items:center;min-height:29px;margin-bottom:1px;border-radius:3px;color:#929a96}
    .session-row:hover {background:var(--hover);color:#c8cdca}
    .session-row.active {background:var(--selected);color:#e0e3e1}
    .session-select {display:flex;align-items:center;gap:7px;min-width:0;flex:1;height:29px;padding:0 7px 0 28px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;font-size:11px}
    .session-title {min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .attention {width:6px;height:6px;flex:none;border-radius:50%;background:#6b726e}
    .attention.unread {background:var(--notice);box-shadow:0 0 0 2px #62aef51b}
    .session-actions {display:none;align-items:center;padding-right:2px}
    .session-row:hover .session-actions,.session-row:focus-within .session-actions {display:flex}
    .session-actions .icon-button {width:23px;height:23px;border:0;background:transparent;color:#858d89}
    .session-actions .icon-button:hover {background:#313431;color:#d8dcda}
    .session-row:hover .attention,.session-row:focus-within .attention {display:none}
    .hidden-toggle {display:flex;align-items:center;gap:7px;width:100%;height:30px;margin-top:7px;padding:0 7px;border:0;border-top:1px solid var(--line);background:transparent;color:#69716d;cursor:pointer;text-align:left;font-size:10px}
    .hidden-toggle span {flex:1}
    .sidebar-foot {display:flex;align-items:center;gap:4px;height:38px;padding:0 8px;border-top:1px solid var(--line);background:#161817}
    .sidebar-foot .settings-link {display:flex;align-items:center;gap:7px;height:28px;margin-left:auto;padding:0 8px;border:0;border-radius:4px;background:transparent;color:#89918d;cursor:pointer;font-size:10.5px}
    .sidebar-foot button:hover {background:var(--hover);color:#d1d5d3}

    .main {display:flex;min-width:0;flex:1;flex-direction:column;background:var(--terminal)}
    .tabs {display:flex;align-items:flex-end;gap:2px;height:41px;padding:5px 8px 0 0;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);background:#151716;scrollbar-width:thin}
    .tab {position:relative;display:flex;width:176px;min-width:124px;max-width:176px;height:35px;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;color:#858d89}
    .tab:hover:not(.active) {background:#1a1d1b;color:#b7bdb9}
    .tab.active {border-color:var(--line);background:var(--terminal);color:#e0e4e2}
    .tab.active::before {position:absolute;z-index:1;top:-1px;right:8px;left:8px;height:2px;border-radius:2px;background:var(--accent);content:""}
    .tab.active::after {position:absolute;right:0;bottom:-1px;left:0;height:1px;background:var(--terminal);content:""}
    .tab.dragging {opacity:.4}
    .tab.drop-before {box-shadow:inset 2px 0 var(--accent)}
    .tab.drop-after {box-shadow:inset -2px 0 var(--accent)}
    .tab-select {display:flex;align-items:center;gap:8px;min-width:0;flex:1;padding:0 5px 0 12px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;font-size:11px}
    .tab-title {min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tab .icon-button {width:23px;height:23px;margin:auto 5px auto 0;border:0;background:transparent;color:#69716d;opacity:0}
    .tab.active .icon-button {opacity:.55}
    .tab:hover .icon-button,.tab:focus-within .icon-button {opacity:1}
    .tab .icon-button:hover {background:#292c2a;color:#e0e4e2}
    .tab .attention {background:var(--notice)}
    .new-tab {display:grid;place-items:center;width:27px;height:27px;margin:0 0 4px 4px;flex:none;border:1px solid transparent;border-radius:4px;background:transparent;color:#747c78;cursor:pointer}
    .new-tab:hover {border-color:var(--line);background:#202321;color:#d2d6d4}
    .terminal {display:flex;min-height:0;flex:1;flex-direction:column;background:var(--terminal)}
    .terminal-output {min-height:0;flex:1;overflow:auto;padding:22px 28px 14px;color:var(--terminal-text);font:var(--terminal-font-size)/1.58 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;white-space:pre-wrap}
    .terminal-output p {margin:0 0 12px}
    .terminal-output .welcome {color:var(--cyan)}
    .terminal-output .muted {color:#78817c}
    .terminal-output .command {display:inline-block;padding:4px 8px;border:1px solid #3c4440;border-radius:4px;background:#121513;color:#d8dcda}
    .terminal-output .success {color:var(--green)}
    .terminal-output .purple {color:var(--purple)}
    .terminal-output .warning {color:var(--yellow)}
    .prompt {display:flex;align-items:center;gap:8px;margin:0 20px 13px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius);background:#111312;color:#77807b}
    .prompt:focus-within {border-color:#4d5651}
    .prompt input {min-width:0;flex:1;border:0;outline:0;background:transparent;color:#d6dad8;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
    .prompt button {display:grid;place-items:center;width:27px;height:27px;border:0;border-radius:4px;background:#b7bcb7;color:#111412;cursor:pointer}
    .empty-state,.repair-card {display:grid;min-height:0;flex:1;place-items:center;padding:30px;text-align:center}
    .empty-state h2,.repair-card h2 {margin:0 0 8px;font-size:16px;font-weight:560}
    .empty-state p,.repair-card p {max-width:470px;margin:0 0 18px;color:var(--muted);font-size:11.5px;line-height:1.55}
    .repair-panel {width:min(470px,100%);padding:25px;border:1px solid var(--line);border-radius:7px;background:#151817}
    .repair-panel .meta {margin:17px 0;padding:10px;border:1px solid #282c2a;border-radius:4px;background:#101211;color:#858d89;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;text-align:left}
    .statusbar {display:flex;align-items:center;gap:9px;height:29px;padding:0 10px;border-top:1px solid #242725;background:#141615;color:#777f7b;font-size:9.5px}
    .statusbar .push {margin-left:auto}
    .status-chip {padding:2px 6px;border:1px solid #313532;border-radius:3px;color:#939b97;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

    .settings-shell {display:grid;grid-template-columns:var(--settings-nav-width) minmax(0,1fr);min-width:0;flex:1;background:#121413}
    .settings-nav {display:flex;min-height:0;flex-direction:column;padding:17px 10px 10px;border-right:1px solid var(--line);background:#171918}
    .settings-nav h2 {margin:0 9px 14px;color:#dce0de;font-size:16px;font-weight:560}
    .settings-nav button[data-settings-section] {display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 9px;border:0;border-radius:4px;background:transparent;color:#8d9591;cursor:pointer;text-align:left;font-size:11.5px}
    .settings-nav button[data-settings-section]:hover {background:var(--hover);color:#cbd0cd}
    .settings-nav button.active {background:var(--selected);color:#e0e3e1}
    .settings-nav > button[data-action="close-settings"] {display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 9px;border:0;border-radius:4px;background:transparent;color:#8d9591;cursor:pointer;text-align:left;font-size:11.5px}
    .settings-nav > button[data-action="close-settings"]:hover {background:var(--hover);color:#cbd0cd}
    .settings-nav .nav-spacer {flex:1}
    .settings-version {padding:12px 9px 4px;border-top:1px solid var(--line);color:#6f7773;font:9.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    .settings-main {min-width:0;overflow:auto;background:#111312}
    .settings-content {width:min(800px,calc(100% - 52px));margin:0 auto;padding:35px 0 70px}
    .settings-heading {display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:25px}
    .settings-heading h1 {margin:0 0 6px;color:#e0e4e2;font-size:22px;font-weight:550;letter-spacing:-.35px}
    .settings-heading p {margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
    .settings-group {margin-bottom:24px}
    .settings-group h3 {margin:0 0 8px;color:#9ba39f;font-size:10px;font-weight:650;letter-spacing:1px;text-transform:uppercase}
    .settings-card {overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#181a19}
    .setting-row {display:flex;align-items:center;gap:20px;min-height:58px;padding:11px 14px;border-bottom:1px solid #272a28}
    .setting-row:last-child {border-bottom:0}
    .setting-copy {min-width:0;flex:1}
    .setting-copy strong {display:block;color:#cbd0ce;font-size:12px;font-weight:520}
    .setting-copy small {display:block;margin-top:3px;color:#747c78;font-size:10.5px;line-height:1.4}
    .setting-control {flex:none}
    .text-input,.select {height:32px;border:1px solid #343835;border-radius:4px;background:#101211;color:#cbd0cd;font-size:11px}
    .text-input {width:260px;padding:0 9px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .select {min-width:155px;padding:0 27px 0 9px}
    .switch {position:relative;width:35px;height:20px;cursor:pointer}
    .switch input {position:absolute;opacity:0}
    .switch span {position:absolute;inset:0;border:1px solid #3a3e3b;border-radius:12px;background:#252825;transition:120ms}
    .switch span::after {position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#878f8a;content:"";transition:120ms}
    .switch input:checked+span {border-color:var(--accent);background:color-mix(in srgb,var(--accent),#151817 28%)}
    .switch input:checked+span::after {left:18px;background:#e2e6e3}
    .segment {display:flex;padding:2px;border:1px solid #343835;border-radius:5px;background:#101211}
    .segment button {height:27px;padding:0 9px;border:0;border-radius:3px;background:transparent;color:#77807b;cursor:pointer;font-size:10px}
    .segment button.active {background:#303431;color:#d7dbd8}
    .color-list {display:flex;gap:7px}
    .swatch {width:25px;height:25px;border:2px solid transparent;border-radius:50%;cursor:pointer}
    .swatch.active {border-color:#e1e5e2;box-shadow:0 0 0 2px #111312}
    .color-picker {width:34px;height:28px;padding:2px;border:1px solid #3a3e3b;border-radius:4px;background:#111312;cursor:pointer}
    input[type=range] {width:190px;accent-color:var(--accent)}
    .range-label {display:inline-block;width:45px;color:#aeb5b1;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}
    .terminal-preview {padding:15px 16px;background:var(--terminal);color:var(--terminal-text);font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
    .harness-row {display:grid;grid-template-columns:minmax(130px,1fr) minmax(180px,1.4fr) auto;align-items:center;gap:14px;min-height:62px;padding:10px 14px;border-bottom:1px solid #272a28}
    .harness-row:last-child {border-bottom:0}
    .harness-row strong {font-size:12px;font-weight:520}
    .harness-row code {overflow:hidden;color:#848d88;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}
    .settings-note {margin-top:9px;color:#6f7773;font-size:10px;line-height:1.5}
    .shortcut-list .setting-row {min-height:47px}
    .keys {display:flex;gap:4px}
    .keys kbd {min-width:25px;padding:4px 7px;border:1px solid #3a3e3b;border-bottom-color:#505650;border-radius:4px;background:#222522;color:#aeb5b1;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}
    .about-mark {display:flex;align-items:center;gap:11px;padding:17px 14px}
    .about-mark svg {width:25px;height:25px;color:#aab1ad}
    .about-mark strong {display:block;font-size:14px;font-weight:570}
    .about-mark small {color:#77807b;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}

    .cover {position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:#070808d9;backdrop-filter:blur(2px)}
    .dialog {width:min(580px,calc(100vw - 36px));max-height:min(720px,calc(100vh - 36px));overflow:auto;border:1px solid #363a37;border-radius:7px;background:#181a19;box-shadow:0 30px 80px #000c}
    .dialog.small {width:min(430px,calc(100vw - 36px))}
    .dialog-head {display:flex;align-items:flex-start;justify-content:space-between;padding:18px 19px 15px;border-bottom:1px solid var(--line)}
    .dialog-head h2 {margin:0;color:#e0e4e1;font-size:16px;font-weight:550}
    .dialog-head p {margin:5px 0 0;color:#7e8682;font-size:10.5px;line-height:1.45}
    .dialog-body {padding:15px 18px 18px}
    .dialog-footer {display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#151716}
    .wizard-kicker {margin-bottom:10px;color:#717975;font-size:9px;font-weight:650;letter-spacing:1px;text-transform:uppercase}

    const spaces=[

      {id:'beacon',name:'Beacon Web',path:'/workspace/beacon-web'},

      {id:'retry',workspace:'default',project:'atlas',title:'Retry Handling',tool:'opencode',open:false,unread:false,favorite:false,status:'stopped',cliId:'oc-812c'},
      {id:'identity',workspace:'default',project:'atlas',title:'Missing Session Identity',tool:'Codex',open:false,unread:false,favorite:false,status:'stopped',cliId:''},
      {id:'release-notes',workspace:'release',project:'orion',title:'Release Notes',tool:'Claude Code',open:true,unread:false,favorite:true,status:'waiting',cliId:'cc-119d'},

        {id:'claude',name:'Claude Code',executable:'claude',launchArgs:'',args:'--resume {sessionId}',strategy:'output discovery',idQuery:'provider output event',workingDir:'{projectPath}',dataDir:'<platform data>/claude'},
        {id:'codex',name:'Codex',executable:'codex',launchArgs:'',args:'resume {sessionId}',strategy:'preassigned or rollout discovery',idQuery:'rollout metadata lookup',workingDir:'{projectPath}',dataDir:'<platform data>/codex'},
        {id:'copilot',name:'Copilot',executable:'copilot',launchArgs:'',args:'--resume {sessionId}',strategy:'output discovery',idQuery:'provider output event',workingDir:'{projectPath}',dataDir:'<platform data>/copilot'},
        {id:'opencode',name:'opencode',executable:'opencode',launchArgs:'',args:'--session {sessionId}',strategy:'provider store lookup',idQuery:'provider session store',workingDir:'{projectPath}',dataDir:'<platform data>/opencode'},

    function cycleTab(offset){const tabs=orderedTabs();if(tabs.length<2)return;const index=Math.max(0,tabs.findIndex(item=>item.id===currentId())),next=tabs[(index+offset+tabs.length)%tabs.length];selectSession(next.id)}

    function harnessModal(modal){
      const item=state.harnesses.find(harness=>harness.id===modal.id)||{id:'',name:'',executable:'',launchArgs:'',args:'',strategy:'output discovery',idQuery:'provider output event',workingDir:'{projectPath}',dataDir:''};
      return '<div class="cover"><form class="dialog" data-form="harness" role="dialog" aria-modal="true"><header class="dialog-head"><div><h2>'+(modal.id?'Edit harness':'Add custom harness')+'</h2><p>Define how Anchor starts, resumes, and identifies this terminal provider.</p></div><button type="button" class="icon-button" data-action="dismiss-modal" aria-label="Close">'+icon('close')+'</button></header><div class="dialog-body"><input type="hidden" name="id" value="'+esc(item.id)+'"><label class="field">Display name<input name="name" value="'+esc(item.name)+'" required placeholder="Hermes"></label><label class="field">Executable<input name="executable" value="'+esc(item.executable)+'" required placeholder="hermes"></label><label class="field">Launch arguments<input name="launchArgs" value="'+esc(item.launchArgs)+'" placeholder="--new"></label><label class="field">Resume arguments<input name="args" value="'+esc(item.args)+'" placeholder="--resume {sessionId}"></label><label class="field">Session ID strategy<select name="strategy"><option '+(item.strategy==='output discovery'?'selected':'')+'>output discovery</option><option '+(item.strategy==='provider store lookup'?'selected':'')+'>provider store lookup</option><option '+(item.strategy==='preassigned ID'?'selected':'')+'>preassigned ID</option><option '+(item.strategy==='not applicable'?'selected':'')+'>not applicable</option></select></label><label class="field">Session ID extraction or query<input name="idQuery" value="'+esc(item.idQuery)+'" placeholder="provider output event"></label><label class="field">Working-directory rule<input name="workingDir" value="'+esc(item.workingDir)+'" placeholder="{projectPath}"></label><label class="field">Dedicated data directory<input name="dataDir" value="'+esc(item.dataDir)+'" placeholder="&lt;platform data&gt;/anchor/harnesses/hermes"></label><p class="settings-note">Use placeholders such as {sessionId}, {projectPath}, and {workingDirectory}. Anchor validates values before it starts a process.</p></div><footer class="dialog-footer"><button type="button" class="button ghost" data-action="dismiss-modal">Cancel</button><button class="button primary">Save harness</button></footer></form></div>';
    }
    function menuMarkup(){
      const menu=state.menu;if(!menu)return '';
      const item=menu.type==='session'?sessions.find(session=>session.id===menu.id):project(menu.id);
      let content='';
      if(menu.type==='session')content='<button data-action="toggle-favorite" data-id="'+item.id+'">'+icon('star')+(item.favorite?'Remove from favorites':'Add to favorites')+'</button><button data-action="rename-session" data-id="'+item.id+'">'+icon('edit')+'Rename session</button><button data-action="copy-session-id" data-id="'+item.id+'">'+icon('anchor')+'Copy session ID</button>'+(!['Terminal','Generic terminal'].includes(item.tool)&&item.status==='stopped'?'<button data-action="set-session-id" data-id="'+item.id+'">'+icon('wrench')+'Set session ID</button>':'')+'<hr><button data-action="'+(item.open?'minimize-session':'delete-session')+'" data-id="'+item.id+'" class="'+(item.open?'':'danger-item')+'">'+icon(item.open?'minimize':'trash')+(item.open?'Close tab':'Delete session')+'</button>';
      if(menu.type==='project')content='<button data-action="new-in-project" data-id="'+item.id+'">'+icon('plus')+'New session</button><button data-action="rename-project" data-id="'+item.id+'">'+icon('edit')+'Rename group</button><button data-action="copy-project-path" data-id="'+item.id+'">'+icon('folder')+'Copy folder path</button><button data-action="toggle-project" data-id="'+item.id+'">'+icon('chevron')+(state.collapsed.has(item.id)?'Expand group':'Collapse group')+'</button><hr><button class="danger-item" data-action="remove-project" data-id="'+item.id+'">'+icon('trash')+'Remove group</button>';
      if(menu.type==='workspace'){const space=spaces.find(workspace=>workspace.id===menu.id);content='<button data-action="toggle-pin-workspace" data-id="'+space.id+'">'+icon('star')+(space.pinned?'Unpin workspace':'Pin workspace')+'</button>'+(space.id==='default'?'':'<button data-action="toggle-archive-workspace" data-id="'+space.id+'">'+icon('archive')+(space.archived?'Restore workspace':'Archive workspace')+'</button>');}
      return '<div class="menu" role="menu" data-menu>'+content+'</div>';
    }
    function positionMenu(){const menu=document.querySelector('[data-menu]');if(!menu||!state.menu)return;const anchor=state.menu.anchor;const width=205,height=menu.offsetHeight||150;menu.style.left=Math.max(6,Math.min(anchor.x,window.innerWidth-width-6))+'px';menu.style.top=Math.max(6,Math.min(anchor.y,window.innerHeight-height-6))+'px'}
    function openMenu(type,id,target,point){const rect=target?.getBoundingClientRect();state.menu={type,id,anchor:point||{x:rect?.right-195||10,y:(rect?.bottom||10)+3}};render()}
    function openNew(projectId){state.menu=null;state.modal={kind:'new-session',step:projectId?'tool':'folder',projectId:projectId||null};render()}
    function launchHarness(tool,projectId){const harness=state.harnesses.find(item=>item.name===tool),newId='session-'+(++state.sequence);sessions.push({id:newId,workspace:state.workspace,project:projectId,title:'New '+tool+' chat',tool,open:true,unread:false,favorite:false,status:'running',cliId:harness?.id==='terminal'?'':'demo-'+state.sequence});(state.tabOrder[state.workspace]||=[]).push(newId);state.modal=null;selectSession(newId);toast(tool+' session started')}
    function switchWorkspace(id){const space=spaces.find(item=>item.id===id&&!item.archived);if(!space)return;state.workspace=id;state.view='terminal';state.menu=null;state.modal=null;if(state.settings.railAutoCollapse&&!state.railPinned)state.railOpen=false;const active=current();if(!active?.open)state.activeByWorkspace[id]=orderedTabs()[0]?.id||null;render()}
    function demoTitle(message){const words=message.replace(/[^A-Za-z0-9 -]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,4);while(words.length<3)words.push(words.length===1?'Work':'Session');return words.map(word=>word[0].toUpperCase()+word.slice(1)).join(' ')}
    function toast(message){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),2200)}
    function rename(kind,id){state.menu=null;state.modal={kind:'rename',target:kind,id};render()}
    app.addEventListener('click',async event=>{
      const button=event.target.closest('[data-action]');if(!button){if(state.menu){state.menu=null;render()}return}
      const action=button.dataset.action,id=button.dataset.id;
      if(!['session-menu','project-menu','workspace-menu'].includes(action))state.menu=null;
      if(action==='toggle-workspace-rail'){state.railOpen=!state.railOpen;render()}
      else if(action==='switch-workspace')switchWorkspace(id);
      else if(action==='manage-workspaces') {state.modal={kind:'workspaces',showArchived:false};render()}
      else if(action==='new-workspace'){state.modal={kind:'workspace-create'};render()}
      else if(action==='toggle-archived'){state.modal.showArchived=!state.modal.showArchived;render()}
      else if(action==='workspace-menu')openMenu('workspace',id,button);
      else if(action==='toggle-pin-workspace'){const item=spaces.find(w=>w.id===id);item.pinned=!item.pinned;render()}
      else if(action==='toggle-archive-workspace'){const item=spaces.find(w=>w.id===id);item.archived=!item.archived;state.menu=null;state.modal={kind:'workspaces',showArchived:item.archived};render()}
      else if(action==='select-session')selectSession(id);
      else if(action==='toggle-project'){state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);render()}
      else if(action==='toggle-hidden'){state.hiddenOpen=!state.hiddenOpen;render()}
      else if(action==='new-session')openNew();
      else if(action==='new-in-project')openNew(id);
      else if(action==='session-menu')openMenu('session',id,button);
      else if(action==='project-menu')openMenu('project',id,button);
      else if(action==='minimize-session')closeTab(id,true);
      else if(action==='close-tab')closeTab(id,false);
      else if(action==='force-close'){state.modal=null;closeTab(id,true)}
      else if(action==='delete-session'){state.modal={kind:'delete',id};render()}
      else if(action==='confirm-delete'){const index=sessions.findIndex(s=>s.id===id);if(index>=0)sessions.splice(index,1);state.modal=null;render();toast('Session deleted')}
      else if(action==='toggle-favorite'){const item=sessions.find(s=>s.id===id);item.favorite=!item.favorite;render()}
      else if(action==='rename-session')rename('session',id);
      else if(action==='rename-project')rename('project',id);
      else if(action==='remove-project'){state.modal={kind:'remove-project',id};render()}
      else if(action==='confirm-remove-project'){const ids=sessions.filter(session=>session.project===id).map(session=>session.id);for(let index=sessions.length-1;index>=0;index--)if(ids.includes(sessions[index].id))sessions.splice(index,1);const projectIndex=projects.findIndex(item=>item.id===id);if(projectIndex>=0)projects.splice(projectIndex,1);state.projectOrder=state.projectOrder.filter(projectId=>projectId!==id);for(const spaceId of Object.keys(state.tabOrder))state.tabOrder[spaceId]=state.tabOrder[spaceId].filter(sessionId=>!ids.includes(sessionId));for(const spaceId of Object.keys(state.activeByWorkspace))if(ids.includes(state.activeByWorkspace[spaceId]))state.activeByWorkspace[spaceId]=state.tabOrder[spaceId]?.[0]||null;state.modal=null;render();toast('Project group removed')}
      else if(action==='copy-session-id'){const item=sessions.find(s=>s.id===id);if(!item.cliId){toast('No session ID saved');return}try{await navigator.clipboard.writeText(item.cliId);toast('Session ID copied')}catch{toast('Session ID: '+item.cliId)}}
      else if(action==='copy-project-path'){const path=project(id)?.path;try{await navigator.clipboard.writeText(path);toast('Folder path copied')}catch{toast('Folder path: '+path)}}
      else if(action==='set-session-id'){state.modal={kind:'set-id',id};render()}
      else if(action==='repair-session'){const item=sessions.find(s=>s.id===id);item.cliId='cx-demo-'+(++state.sequence);item.status='running';toast('New provider chat attached');render()}
      else if(action==='open-settings'){state.view='settings';state.menu=null;state.modal=null;render()}
      else if(action==='close-settings'){state.view='terminal';render()}
      else if(action==='open-palette'){state.modal={kind:'palette'};render();requestAnimationFrame(()=>document.querySelector('[data-palette-filter]')?.focus())}
      else if(action==='focus-search'){document.querySelector('[data-session-filter]')?.focus()}
      else if(action==='dismiss-modal'){state.modal=null;render()}
      else if(action==='choose-folder'){toast('Native folder picker would open here')}
      else if(action==='create-project-step'){state.modal.step='create';render()}
      else if(action==='choose-project'){state.modal.step='tool';state.modal.projectId=id;render()}
      else if(action==='wizard-back'){state.modal.step='folder';render()}
      else if(action==='launch-session')launchHarness(button.dataset.tool,id);
      else if(action==='set-theme'){state.settings.theme=button.dataset.value;render()}
      else if(action==='set-accent'){state.settings.accent=button.dataset.value;render()}
      else if(action==='set-density'){state.settings.density=button.dataset.value;render()}
      else if(action==='edit-harness'){state.modal={kind:'harness',id};render()}
      else if(action==='add-harness'){state.modal={kind:'harness',id:null};render()}
      else if(action==='show-settings-json'){state.modal={kind:'settings-json'};render()}
      else if(action==='demo-toast')toast(button.dataset.message);
    });
    app.addEventListener('contextmenu',event=>{const row=event.target.closest('[data-session]');if(!row)return;event.preventDefault();openMenu('session',row.dataset.session,null,{x:event.clientX,y:event.clientY})});
    app.addEventListener('input',event=>{
      if(event.target.matches('[data-session-filter]')){state.filter=event.target.value;document.querySelector('.session-lists').innerHTML=sessionSidebar().match(/<div class="session-lists">([\s\S]*)<\/div><footer/)[1]}
      if(event.target.matches('[data-workspace-filter],[data-modal-workspace-filter]')){const term=event.target.value.trim().toLowerCase(),scope=event.target.matches('[data-modal-workspace-filter]')?document.querySelector('.workspace-results'):document.querySelector('.rail-list');scope?.querySelectorAll('[data-workspace]').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(term)?'':'none'})}
      if(event.target.matches('[data-palette-filter]')){const term=event.target.value.trim().toLowerCase();document.querySelectorAll('[data-palette-results] .choice').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(term)?'':'none'})}
      if(event.target.matches('[data-prompt] input')&&currentId())state.drafts[currentId()]=event.target.value;
      if(event.target.dataset.setting){
        const key=event.target.dataset.setting,value=event.target.type==='range'||['responseReadDelayMs','hideEmptyHours'].includes(key)?Number(event.target.value):event.target.value;
        state.settings[key]=value;
        const terminalVars={terminalBackground:'--terminal',terminalForeground:'--terminal-text',terminalGreen:'--green',terminalCyan:'--cyan',terminalPurple:'--purple',terminalYellow:'--yellow'};
        if(terminalVars[key]){app.style.setProperty(terminalVars[key],value);const label=event.target.closest('.setting-row')?.querySelector('small');if(label)label.textContent=value;}
        if(key==='fontSize'||key==='retentionDays')render();
      }
    });
    app.addEventListener('change',event=>{if(event.target.dataset.setting&&event.target.type==='checkbox')state.settings[event.target.dataset.setting]=event.target.checked;if(event.target.matches('[data-remove-ack]'))document.querySelector('[data-action="confirm-remove-project"]').disabled=!event.target.checked});
    app.addEventListener('submit',event=>{
      event.preventDefault();
      if(event.target.matches('[data-prompt]')){const input=event.target.elements.message,message=input.value.trim(),item=current();if(!message||!item)return;(state.logs[item.id]||=[]).push({user:true,text:'› '+message});state.drafts[item.id]='';item.awaiting=true;item.status='running';item.lastSubmitted=Date.now();if(state.settings.autoTitle&&/^New .+ chat$/.test(item.title))item.title=demoTitle(message);render();setTimeout(()=>{item.awaiting=false;item.status='waiting';(state.logs[item.id]||=[]).push({user:false,text:'Demo response complete. The session is waiting for your input.'});if(currentId()!==item.id)item.unread=true;render()},1300)}
      if(event.target.matches('[data-form="set-id"]')){const data=new FormData(event.target),item=sessions.find(s=>s.id===data.get('id'));item.cliId=String(data.get('cliId')).trim();state.modal=null;render();toast('Session ID saved')}
      if(event.target.matches('[data-form="rename"]')){const data=new FormData(event.target),target=String(data.get('target')),id=String(data.get('id')),name=String(data.get('name')).trim(),item=target==='session'?sessions.find(session=>session.id===id):project(id);if(target==='session')item.title=name;else item.name=name;state.modal=null;render();toast('Name updated')}
      if(event.target.matches('[data-form="workspace"]')){const data=new FormData(event.target),name=String(data.get('name')).trim(),id='workspace-'+(++state.sequence);spaces.push({id,name,pinned:false,archived:false});state.activeByWorkspace[id]=null;state.tabOrder[id]=[];state.modal={kind:'workspaces',showArchived:false};render();toast('Workspace created')}
      if(event.target.matches('[data-form="create-project"]')){const data=new FormData(event.target),name=String(data.get('name')).trim(),id='project-'+(++state.sequence);projects.push({id,name,path:'/workspace/'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-')});state.projectOrder.push(id);state.modal={kind:'new-session',step:'tool',projectId:id};render()}
      if(event.target.matches('[data-form="harness"]')){const data=new FormData(event.target),id=String(data.get('id'))||'custom-'+(++state.sequence),item=state.harnesses.find(h=>h.id===id),values={id,name:String(data.get('name')),executable:String(data.get('executable')),launchArgs:String(data.get('launchArgs')),args:String(data.get('args')),strategy:String(data.get('strategy')),idQuery:String(data.get('idQuery')),workingDir:String(data.get('workingDir')),dataDir:String(data.get('dataDir'))};if(item)Object.assign(item,values);else state.harnesses.push(values);state.modal=null;render();toast('Harness saved')}
    });
    app.addEventListener('click',event=>{const nav=event.target.closest('[data-settings-section]');if(nav){state.settingsSection=nav.dataset.settingsSection;render()}});
    // Chromium requires a data payload to keep the native drag sequence alive through the drop event.
    app.addEventListener('dragstart',event=>{const tab=event.target.closest('[data-tab]'),row=event.target.closest('[data-session]'),group=event.target.closest('[data-project]');if(tab){state.dragTab=tab.dataset.tab;tab.classList.add('dragging');event.dataTransfer.setData('text/plain',tab.dataset.tab);event.dataTransfer.effectAllowed='move'}else if(row){state.dragSession=row.dataset.session;event.dataTransfer.setData('text/plain',row.dataset.session);event.dataTransfer.effectAllowed='move'}else if(group){state.dragProject=group.dataset.project;group.classList.add('dragging');event.dataTransfer.effectAllowed='move'}});
    app.addEventListener('dragover',event=>{const tab=event.target.closest('[data-tab]'),group=event.target.closest('[data-project]');if(tab&&state.dragTab){event.preventDefault();const after=event.clientX>tab.getBoundingClientRect().left+tab.offsetWidth/2;tab.classList.toggle('drop-before',!after);tab.classList.toggle('drop-after',after)}if(group&&state.dragProject&&!state.dragSession){event.preventDefault();group.classList.add('drop-before')}const workspace=event.target.closest('[data-workspace]');if(workspace&&state.dragSession)event.preventDefault()});
    app.addEventListener('dragleave',event=>{const tab=event.target.closest('[data-tab]');tab?.classList.remove('drop-before','drop-after');event.target.closest('[data-project]')?.classList.remove('drop-before')});
    // A workspace move changes only ownership; the saved provider identity, transcript, and favorite state remain on the same record.
    app.addEventListener('drop',event=>{const tab=event.target.closest('[data-tab]'),group=event.target.closest('[data-project]'),workspace=event.target.closest('[data-workspace]');if(tab&&state.dragTab){event.preventDefault();const order=state.tabOrder[state.workspace],moving=state.dragTab,target=tab.dataset.tab;if(moving!==target){order.splice(order.indexOf(moving),1);const targetIndex=order.indexOf(target),after=event.clientX>tab.getBoundingClientRect().left+tab.offsetWidth/2;order.splice(targetIndex+(after?1:0),0,moving)}}else if(workspace&&state.dragSession){event.preventDefault();const item=sessions.find(session=>session.id===state.dragSession),destination=workspace.dataset.workspace;if(item&&destination&&destination!==item.workspace){const source=item.workspace;item.workspace=destination;if(state.activeByWorkspace[source]===item.id)state.activeByWorkspace[source]=visible().find(session=>session.open&&session.id!==item.id)?.id||null;toast('Moved to '+spaces.find(space=>space.id===destination)?.name)}}else if(group&&state.dragProject){event.preventDefault();const from=state.projectOrder.indexOf(state.dragProject),to=state.projectOrder.indexOf(group.dataset.project);state.projectOrder.splice(from,1);state.projectOrder.splice(to,0,state.dragProject)}state.dragTab=null;state.dragProject=null;state.dragSession=null;render()});
    document.addEventListener('keydown',event=>{
      const command=event.metaKey||event.ctrlKey,key=event.key.toLowerCase();
      if(state.modal?.kind==='palette'&&['ArrowDown','ArrowUp'].includes(event.key)){
        event.preventDefault();
        const choices=[...document.querySelectorAll('[data-palette-results] .choice')].filter(item=>item.style.display!=='none'),active=choices.indexOf(document.activeElement);
        const next=active<0?(event.key==='ArrowDown'?0:choices.length-1):(active+(event.key==='ArrowDown'?1:-1)+choices.length)%choices.length;
        choices[next]?.focus();
        return;
      }
      if(state.modal?.kind==='palette'&&event.key==='Enter'){
        event.preventDefault();
        const active=document.activeElement?.closest?.('[data-palette-results] .choice'),first=[...document.querySelectorAll('[data-palette-results] .choice')].find(item=>item.style.display!=='none');
        (active||first)?.click();
        return;
      }
      if(event.ctrlKey&&event.key==='Tab'){event.preventDefault();cycleTab(event.shiftKey?-1:1);return}
      if(command&&event.key===','){event.preventDefault();state.view='settings';state.modal=null;render();return}
      if(command&&key==='k'){event.preventDefault();state.view='terminal';state.modal={kind:'palette'};render();requestAnimationFrame(()=>document.querySelector('[data-palette-filter]')?.focus());return}
      if(command&&key==='w'&&state.view==='terminal'){event.preventDefault();if(currentId())closeTab(currentId());return}
      if(command&&key==='t'){event.preventDefault();if(state.view==='settings')state.view='terminal';launchHarness('Generic terminal',current()?.project||projects[0]?.id);return}
      if(command&&event.key==='Enter'){event.preventDefault();resumeCurrent();return}
      if(command&&key==='f'){event.preventDefault();if(state.view==='settings')state.view='terminal';render();requestAnimationFrame(()=>document.querySelector('[data-session-filter]')?.focus());return}
      if(event.key==='Escape'){if(state.menu||state.modal){state.menu=null;state.modal=null;render()}else if(state.view==='settings'){state.view='terminal';render()}}
    });
    render();
  })();
  </script>
